# =============================================================================
# Forge Local - stack de producción con Ollama
# =============================================================================
# Uso local/servidor:
#   cp .env.example .env
#   # define SESSION_SECRET y PUBLIC_ORIGIN en .env
#   docker compose up -d --build
#   docker compose exec ollama ollama pull <modelo>
#   docker compose exec forge node apps/server/dist/cli/create-user.js --admin --email tu@correo.com
#
# Coolify: despliega este archivo como recurso "Docker Compose". Coolify gestiona
# el dominio/HTTPS; consulta docs/coolify.md. Las variables ${...} se configuran
# en la UI de Coolify (Environment Variables).
# =============================================================================

name: forge-local

services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-local:1.0.0
    restart: unless-stopped
    init: true
    depends_on:
      ollama:
        condition: service_healthy

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      PROJECTS_ROOT: /projects
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: auto
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET con openssl rand -base64 48}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-48}
      ALLOW_REGISTRATION: "false"
      DEPLOYMENT_MODE: server
      OLLAMA_BASE_URL: http://ollama:11434
      ALLOW_CUSTOM_RUNTIME: "false"
      RUNTIME_ALLOWED_HOSTS: ollama
      RUNTIME_ALLOWED_PORTS: "11434"
      RUNTIME_TIMEOUT_MS: ${RUNTIME_TIMEOUT_MS:-120000}
      RUNTIME_STREAM_IDLE_TIMEOUT_MS: ${RUNTIME_STREAM_IDLE_TIMEOUT_MS:-120000}
      RUNTIME_NUM_CTX: ${RUNTIME_NUM_CTX:-8192}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-20000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-131072}
      MAX_CONTEXT_BYTES: ${MAX_CONTEXT_BYTES:-262144}
      MAX_CONTEXT_FILES: ${MAX_CONTEXT_FILES:-8}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-67108864}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_BASE_DELAY_MS: ${LOGIN_BASE_DELAY_MS:-250}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      ENABLE_COMMAND_EXECUTION: ${ENABLE_COMMAND_EXECUTION:-false}
      COMMAND_ALLOWLIST: "${COMMAND_ALLOWLIST:-git status,git diff,git log,git show,git rev-parse,git ls-files,node --version,npm --version}"
      COMMAND_TIMEOUT_MS: ${COMMAND_TIMEOUT_MS:-30000}
      COMMAND_MAX_OUTPUT_BYTES: ${COMMAND_MAX_OUTPUT_BYTES:-65536}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      PROPOSAL_TTL_MINUTES: ${PROPOSAL_TTL_MINUTES:-120}
      # Coolify: descomenta esta variable y define el dominio en la UI para que
      # Coolify genere la ruta HTTPS. En Docker Compose normal no es necesaria.
      # SERVICE_FQDN_FORGE_8080: ""

    # Solo accesible desde el propio host (para un proxy inverso o túnel SSH).
    # En Coolify puedes cambiar FORGE_HOST_PORT o eliminar esta sección y dejar
    # que el proxy enrute al puerto interno 8080.
    ports:
      - "127.0.0.1:${FORGE_HOST_PORT:-8080}:8080"

    volumes:
      - forge-data:/data
      - forge-projects:/projects

    # El sistema de archivos de la imagen es de solo lectura; la aplicación solo
    # escribe en /data, /projects y /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${FORGE_MEMORY_LIMIT:-1g}
    cpus: ${FORGE_CPUS:-2.0}
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    networks:
      - edge
      - runtime

  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama

    # Sin `ports`: solo es accesible desde la red interna `runtime`.
    expose:
      - "11434"

    pids_limit: 512
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-12g}
    cpus: ${OLLAMA_CPUS:-4.0}
    stop_grace_period: 20s

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - runtime

networks:
  # Red de borde para el proxy inverso.
  edge:
  # Red privada de runtime. Ollama no publica puertos. Necesita salida a
  # Internet para descargar modelos desde el registro de Ollama.
  runtime:

volumes:
  forge-data:
  forge-projects:
  ollama-models:
